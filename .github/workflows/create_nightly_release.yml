name: Nightly Release

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

# A nightly build must never run twice at the same time: both runs would try to
# create the same nightly-tag-<date> release.
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: print latest_commit
        run: echo ${{ github.sha }}

      - name: check latest commit is less than a day
        id: should_run
        continue-on-error: true
        run: test -z $(git rev-list  --after="24 hours" ${{ github.sha }}) && echo "should_run=false" >> $GITHUB_OUTPUT

  build:
    needs: check_date
    # Scheduled runs only build when there are fresh commits, manual runs always build.
    # Target device: HackRF One Portapack — 1 MB SPI flash (FLASH_MB_LIMIT_SIZE=1).
    if: ${{ needs.check_date.outputs.should_run != 'false' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    name: build (HackRF One Portapack, 1 MB SPI flash)
    steps:
      - name: Get version date
        id: version_date
        run: echo "date=n_$(date +'%y%m%d')" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Git Submodule Update
        run: |
          git submodule update --init --recursive
      - name: Validate hackrf submodule contents
        run: |
          test -f hackrf/firmware/common/clock_io.c || { echo "ERROR: hackrf submodule missing clock_io.c"; exit 1; }
          test -f hackrf/firmware/common/clkin.h || { echo "ERROR: hackrf submodule missing clkin.h"; exit 1; }
          echo "✅ hackrf submodule populated"
      # CMake runs these via `COMMAND ${MAKE_SPI_IMAGE} ...` (direct exec, not
      # `python3 script.py`), but git stores them as 100644 -> "Permission denied".
      # chmod every script in tools/ so a newly added tool cannot break CI again.
      - name: Fix permissions for build scripts
        run: find firmware/tools -type f \( -name '*.py' -o -name '*.sh' \) -exec chmod +x {} +
      - name: Build the Docker image
        run: docker build -t portapack-dev:${{ steps.version_date.outputs.date }} -f dockerfile-nogit .
      - name: Make build folder
        run: mkdir -p ${{ github.workspace }}/build
      - name: Run the Docker image
        # -DFLASH_MB_LIMIT_SIZE=1 = 1 MB SPI flash for HackRF One Portapack target.
        run: docker run -e VERSION_STRING=${{ steps.version_date.outputs.date }} -i -v ${{ github.workspace }}:/havoc portapack-dev:${{ steps.version_date.outputs.date }} -DFLASH_MB_LIMIT_SIZE=1
      - name: Create Small SD Card ZIP - No World Map
        run: |
          mkdir -p sdcard/FIRMWARE && cp build/firmware/portapack-mayhem-firmware.bin sdcard/FIRMWARE/portapack-mayhem_${{ steps.version_date.outputs.date }}.bin && cp build/firmware/portapack-mayhem_OCI.ppfw.tar sdcard/FIRMWARE/mayhem_nightly_${{ steps.version_date.outputs.date }}_OCI.ppfw.tar && mkdir -p sdcard/APPS && cp build/firmware/application/*.ppma sdcard/APPS && cp build/firmware/standalone/*/*.ppmp sdcard/APPS && cd sdcard && zip -r ../sdcard-no-map.zip . && cd ..
      - name: Download world map
        run: |
          wget https://github.com/portapack-mayhem/mayhem-firmware/releases/download/world_map/world_map.zip
      - name: Unzip world map
        run: |
          unzip world_map.zip -d sdcard/ADSB
      - name: Prepare Firmware ZIP
        run: |
          mkdir -p flashing/firmware && cp build/hackrf/firmware/hackrf_usb/hackrf_usb.dfu flashing/firmware/hackrf_usb.dfu && cp build/hackrf/firmware/hackrf_usb/hackrf_usb.bin flashing/firmware/hackrf_usb.bin
      - name: Create Firmware ZIP
        run: |
          zip -j firmware.zip build/firmware/portapack-mayhem-firmware.bin && cd flashing && zip -r ../firmware.zip *
      - name: Create SD Card ZIP
        run: |
          mkdir -p sdcard/FIRMWARE && cp build/firmware/portapack-mayhem-firmware.bin sdcard/FIRMWARE/portapack-mayhem_${{ steps.version_date.outputs.date }}.bin && cp build/firmware/portapack-mayhem_OCI.ppfw.tar sdcard/FIRMWARE/mayhem_nightly_${{ steps.version_date.outputs.date }}_OCI.ppfw.tar && mkdir -p sdcard/APPS && cp build/firmware/application/*.ppma sdcard/APPS && cp build/firmware/standalone/*/*.ppmp sdcard/APPS && cd sdcard && zip -r ../sdcard.zip . && cd ..
      - name: Upload firmware zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ./firmware.zip
      - name: Upload SD card artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcard
          path: ./sdcard.zip
      - name: Upload SD card no-map artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-no-map
          path: ./sdcard-no-map.zip
      - name: Upload OCI tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-tar
          path: build/firmware/portapack-mayhem_OCI.ppfw.tar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Get version date
        id: version_date
        run: echo "date=n_$(date +'%y%m%d')" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'content<<EOF'
            python3 .github/workflows/changelog.py
            echo EOF
          } >> "$GITHUB_OUTPUT"
        id: changelog
      - name: Prepare release assets
        run: |
          VER="${{ steps.version_date.outputs.date }}"
          mkdir -p release_assets

          # Rebuild the firmware zip so it matches the layout expected by
          # flashing/mayhem_flasher.bat (firmware/firmware_hackrf.bin + DFU files).
          mkdir -p firmware_combined
          unzip -q artifacts/firmware/firmware.zip -d firmware_combined
          mv firmware_combined/portapack-mayhem-firmware.bin firmware_combined/firmware/firmware_hackrf.bin
          cd firmware_combined && zip -qr ../firmware_hackrf.zip . && cd ..

          cp firmware_hackrf.zip "release_assets/mayhem_nightly_${VER}_FIRMWARE.zip"
          cp artifacts/oci-tar/portapack-mayhem_OCI.ppfw.tar "release_assets/mayhem_nightly_${VER}_OCI.ppfw.tar"
          cp artifacts/sdcard/sdcard.zip "release_assets/mayhem_nightly_${VER}_COPY_TO_SDCARD.zip"
          cp artifacts/sdcard-no-map/sdcard-no-map.zip "release_assets/mayhem_nightly_${VER}_COPY_TO_SDCARD-no-world-map.zip"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-tag-${{ steps.date.outputs.date }}
          name: Nightly Release - ${{ steps.date.outputs.date }}
          body: |
            **Nightly release - ${{ steps.date.outputs.date }}**
            This build is the latest and greatest, although may not be the most stable as this is a nightly release.
            ## Release notes
            ###  Revision (${{ steps.version_date.outputs.date }}):
            ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: true
          files: release_assets/*
